<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Deutsch Master – Kapitel 5 Gesundheit</title>
<style>
  :root {
    --bg: #090d16;
    --surface: #131b2e;
    --surface-light: #1e293b;
    --border: rgba(255, 255, 255, 0.08);
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --ok: #10b981;
    --bad: #f43f5e;
    --der: #38bdf8;
    --die: #fb7185;
    --das: #4ade80;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
  
  body {
    margin: 0;
    background: radial-gradient(circle at top, #172038 0%, var(--bg) 65%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 84px;
  }

  .app-container {
    width: 100%;
    max-width: 480px;
    padding: 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .brand { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
  .brand span { background: linear-gradient(135deg, #818cf8, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .pill-btn {
    background: var(--surface-light);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }
  .pill-btn:active { transform: scale(0.95); }

  /* Progress Bar */
  .progress-wrap { margin-bottom: 14px; }
  .progress-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .progress-track { width: 100%; height: 6px; background: var(--surface-light); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #38bdf8); width: 0%; transition: width 0.35s ease; }

  /* Controls Row */
  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; }
  select, .search-input {
    flex: 1;
    padding: 11px 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 44px;
    border-radius: 14px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { transform: scale(0.94); }

  /* Tabs */
  .view { display: none; flex-direction: column; flex: 1; }
  .view.active { display: flex; }

  /* Flashcard 3D */
  .card-wrap {
    perspective: 1200px;
    width: 100%;
    height: 310px;
    margin: 6px 0 18px;
    cursor: pointer;
    user-select: none;
  }
  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    transform-style: preserve-3d;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 22px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
  }
  .front {
    background: linear-gradient(145deg, #1a243d, #111827);
  }
  .back {
    background: linear-gradient(145deg, #1e293b, #0f172a);
    border-color: rgba(99, 102, 241, 0.4);
    transform: rotateY(180deg);
  }
  .badge {
    position: absolute;
    top: 18px;
    left: 18px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.06);
    padding: 5px 11px;
    border-radius: 99px;
  }
  .audio-btn {
    position: absolute;
    top: 14px;
    right: 16px;
    background: rgba(99, 102, 241, 0.18);
    border: 1px solid rgba(99, 102, 241, 0.35);
    color: #c7d2fe;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }
  .audio-btn:active { transform: scale(0.9); }

  .word { font-size: 27px; font-weight: 800; line-height: 1.3; word-break: break-word; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .tip-pill {
    margin-top: 12px;
    font-size: 12px;
    color: #93c5fd;
    background: rgba(56, 189, 248, 0.12);
    padding: 4px 10px;
    border-radius: 8px;
  }
  .der { color: var(--der); }
  .die { color: var(--die); }
  .das { color: var(--das); }

  /* Action Buttons */
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn {
    padding: 16px;
    border: none;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.15s, opacity 0.2s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-bad { background: linear-gradient(135deg, #f43f5e, #be123c); box-shadow: 0 8px 20px rgba(244, 63, 94, 0.25); }
  .btn-ok { background: linear-gradient(135deg, #10b981, #047857); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25); }
  .btn-primary { background: linear-gradient(135deg, #6366f1, #4f46e5); width: 100%; }
  .btn-ghost { background: var(--surface-light); border: 1px solid var(--border); color: var(--muted); padding: 12px; font-size: 13px; margin-top: 10px; width: 100%; border-radius: 14px; cursor: pointer; }

  /* Quiz */
  .quiz-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 26px 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .quiz-q { font-size: 24px; font-weight: 800; margin: 10px 0 4px; }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; }
  .opt-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 15px 16px;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--surface-light); }
  .opt-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--ok); color: #6ee7b7; }
  .opt-btn.wrong { background: rgba(244, 63, 94, 0.2); border-color: var(--bad); color: #fda4af; }

  .score-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 28px 20px;
    text-align: center;
  }
  .score-big { font-size: 48px; font-weight: 900; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .mistake-list { text-align: left; margin-top: 18px; max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .mistake-item { background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.25); padding: 10px 12px; border-radius: 12px; font-size: 13px; }

  /* Dictionary List */
  .dict-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .dict-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .dict-de { font-weight: 700; font-size: 15px; margin-bottom: 3px; }
  .dict-pl { font-size: 13px; color: var(--muted); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot-ok { background: var(--ok); }
  .dot-bad { background: var(--bad); }
  .dot-new { background: #475569; }

  /* Bottom Navigation */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 100;
  }
  .nav-inner { width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .nav-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    padding: 8px;
    border-radius: 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: 0.2s;
  }
  .nav-btn span.ico { font-size: 18px; }
  .nav-btn.active { color: #fff; background: rgba(99, 102, 241, 0.2); }
</style>
</head>

    </div>
    <button class="btn-ghost" onclick="resetProgress()">↺ Resetuj cały postęp</button>
  </div>

      </p>
      <button class="btn btn-primary" onclick="startQuiz()">Rozpocznij test (25 pytań)</button>
    </div>

    <div id="quiz-play" style="display: none;">
      <div class="progress-wrap">
        <div class="progress-info">
          <span id="quizCounter">Pytanie 1 / 25</span>
          <span id="quizScoreLive">Wynik: 0</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="quizBar"></div></div>
      </div>

      <div class="quiz-card">
        <div style="font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;">Przetłumacz</div>
        <div class="quiz-q" id="quizQuestion"></div>
      </div>

      <div class="quiz-options" id="quizOptions"></div>
    </div>

    <div id="quiz-end" class="score-box" style="display: none;">
      <div style="font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;">Twój wynik</div>
      <div class="score-big" id="finalScore">0 / 25</div>
      <div id="finalMsg" style="font-size: 15px; margin-top: 6px; font-weight: 600;"></div>

      <button class="btn btn-primary" style="margin-top: 20px;" onclick="startQuiz()">Zagraj jeszcze raz (nowe 25)</button>

  </div>

    <div class="dict-list" id="dictList"></div>

</div>

</nav>

function saveState() {
  localStorage.setItem('k5_mastered', JSON.stringify([...mastered]));
  localStorage.setItem('k5_hard', JSON.stringify([...hard]));
  updateStats();
}

function formatDe(text) {
  if (text.startsWith("der ")) return `<span class="der">der</span> ` + text.slice(4);
  if (text.startsWith("die ")) return `<span class="die">die</span> ` + text.slice(4);
  if (text.startsWith("das ")) return `<span class="das">das</span> ` + text.slice(4);
  return text;
}

function cleanForSpeech(deText) {
  return deText.split(',')[0].replace(/\|/g, '');
}

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(cleanForSpeech(text));
  utter.lang = 'de-DE';
  utter.rate = 0.92;
  window.speechSynthesis.speak(utter);
}

function speakCurrent(e) {
  e.stopPropagation();
  if (!deck.length) return;
  speakText(deck[currentIdx].de);
}

function updateStats() {
  const m = mastered.size;
  const h = hard.size;
  document.getElementById('masteryText').innerText = `Opanowane: ${m} / ${allWords.length}`;
  document.getElementById('hardText').innerText = `Do powtórki: ${h}`;
  document.getElementById('masteryBar').style.width = `${(m / allWords.length) * 100}%`;
}

function toggleDirection() {
  plToDe = !plToDe;
  document.getElementById('dirBtn').innerText = plToDe ? 'PL ➔ DE' : 'DE ➔ PL';
  renderCard();
}

function renderCard() {
  const cardEl = document.getElementById('card');
  cardEl.classList.remove('flipped');
  setTimeout(() => {
    if (deck.length === 0) {
      document.getElementById('cardBadge').innerText = 'Pusto';
      document.getElementById('frontText').innerText = 'Wszystko ogarnięte! 🎉';
      document.getElementById('backText').innerText = 'Wybierz inną lekcję';
      document.getElementById('audioFront').style.display = 'none';
      document.getElementById('audioBack').style.display = 'none';
      document.getElementById('tipBox').innerHTML = '';
      return;
    }
    const item = deck[currentIdx];
    document.getElementById('cardBadge').innerText = `Lektion ${item.l} • ${currentIdx + 1}/${deck.length}`;
    document.getElementById('backBadge').innerText = plToDe ? 'Niemiecki' : 'Polski';

    if (plToDe) {
      document.getElementById('frontText').innerHTML = item.pl;
      document.getElementById('backText').innerHTML = formatDe(item.de);
      document.getElementById('audioFront').style.display = 'none';
      document.getElementById('audioBack').style.display = 'flex';
    } else {
      document.getElementById('frontText').innerHTML = formatDe(item.de);
      document.getElementById('backText').innerHTML = item.pl;
      document.getElementById('audioFront').style.display = 'flex';
      document.getElementById('audioBack').style.display = 'none';
    }

    document.getElementById('tipBox').innerHTML = item.de.includes('|')
      ? `<div class="tip-pill">Czasownik rozdzielnie złożony</div>`
      : '';
  }, 120);
}

function flipCard() {
  if (!deck.length) return;
  document.getElementById('card').classList.toggle('flipped');
}

function markCard(known) {
  if (!deck.length) return;
  const item = deck[currentIdx];
  if (known) {
    mastered.add(item.id);
    hard.delete(item.id);
    if (document.getElementById('lessonSelect').value === 'hard') {
      deck.splice(currentIdx, 1);
      if (currentIdx >= deck.length) currentIdx = 0;
    } else {
      currentIdx = (currentIdx + 1) % deck.length;
    }
  } else {
    hard.add(item.id);
    mastered.delete(item.id);
    currentIdx = (currentIdx + 1) % deck.length;
  }
  saveState();
  renderCard();
}

function filterDeck() {
  const val = document.getElementById('lessonSelect').value;
  if (val === 'all') deck = [...allWords];
  else if (val === 'hard') deck = allWords.filter(w => hard.has(w.id));
  else deck = allWords.filter(w => w.l == val);
  currentIdx = 0;
  renderCard();
}

function shuffleDeck() {
  deck.sort(() => Math.random() - 0.5);
  currentIdx = 0;
  renderCard();
}

function resetProgress() {
  if (!confirm('Wyzerować cały postęp nauki?')) return;
  mastered.clear();
  hard.clear();
  saveState();
  filterDeck();
}

/* --- QUIZ (25 PYTAŃ) --- */
const QUIZ_LEN = 25;
let quizPool = [];
let qIdx = 0;
let qScore = 0;
let qMistakes = [];

function startQuiz() {
  quizPool = [...allWords].sort(() => Math.random() - 0.5).slice(0, QUIZ_LEN);
  qIdx = 0;
  qScore = 0;
  qMistakes = [];
  document.getElementById('quiz-start').style.display = 'none';
  document.getElementById('quiz-end').style.display = 'none';
  document.getElementById('quiz-play').style.display = 'block';
  renderQuizQ();
}

function renderQuizQ() {
  const q = quizPool[qIdx];
  document.getElementById('quizCounter').innerText = `Pytanie ${qIdx + 1} / ${QUIZ_LEN}`;
  document.getElementById('quizScoreLive').innerText = `Wynik: ${qScore}`;
  document.getElementById('quizBar').style.width = `${(qIdx / QUIZ_LEN) * 100}%`;
  document.getElementById('quizQuestion').innerHTML = plToDe ? q.pl : formatDe(q.de);

  const distractors = allWords
    .filter(w => w.id !== q.id)
    .sort(() => Math.random() - 0.5)
    .slice(0, 3);
  const options = [q, ...distractors].sort(() => Math.random() - 0.5);

  const box = document.getElementById('quizOptions');
  box.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span>${plToDe ? formatDe(opt.de) : opt.pl}</span>`;
    btn.onclick = () => checkAnswer(btn, opt.id === q.id, q);
    box.appendChild(btn);
  });
}

function checkAnswer(clickedBtn, isCorrect, q) {
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b => b.disabled = true);

  if (isCorrect) {
    clickedBtn.classList.add('correct');
    qScore++;
  } else {
    clickedBtn.classList.add('wrong');
    qMistakes.push(q);
    hard.add(q.id);
    saveState();
    btns.forEach(b => {
      const targetText = plToDe ? q.de : q.pl;
      if (b.innerText.trim() === targetText.trim()) b.classList.add('correct');
    });
  }

  setTimeout(() => {
    qIdx++;
    if (qIdx < QUIZ_LEN) renderQuizQ();
    else showQuizEnd();
  }, 850);
}

function showQuizEnd() {
  document.getElementById('quiz-play').style.display = 'none';
  document.getElementById('quiz-end').style.display = 'block';
  const pct = Math.round((qScore / QUIZ_LEN) * 100);
  document.getElementById('finalScore').innerText = `${qScore} / ${QUIZ_LEN}`;
  document.getElementById('finalMsg').innerText =
    pct >= 90 ? `Petarda! (${pct}%) Masz to w małym palcu 🔥` :
    pct >= 70 ? `Solidnie! (${pct}%) Jeszcze chwila i będzie 100% 💪` :
    `Wynik: ${pct}%. Błędne słówka wrzuciłem do zakładki "Do powtórki"!`;

  const mBox = document.getElementById('mistakeList');
  if (qMistakes.length === 0) {
    mBox.innerHTML = '';
  } else {
    mBox.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">Do powtórzenia (${qMistakes.length}):</div>` +
      qMistakes.map(m => `<div class="mistake-item"><b>${m.pl}</b> ➔ ${formatDe(m.de)}</div>`).join('');
  }
}

/* --- SŁOWNIK --- */
function renderDict() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const filtered = allWords.filter(w =>
    w.pl.toLowerCase().includes(q) || w.de.toLowerCase().includes(q)
  );
  const list = document.getElementById('dictList');
  list.innerHTML = filtered.map(w => {
    const dot = mastered.has(w.id) ? 'dot-ok' : (hard.has(w.id) ? 'dot-bad' : 'dot-new');
    return `
      <div class="dict-item">
        <div>
          <div class="dict-de"><span class="status-dot ${dot}"></span>${formatDe(w.de)}</div>
          <div class="dict-pl">${w.pl} • Lektion ${w.l}</div>
        </div>
        <button class="icon-btn" style="width:38px;height:38px;border-radius:50%;" onclick="speakText('${w.de.replace(/'/g, "\\'")}')">🔊</button>
      </div>
    `;
  }).join('');
}

/* --- NAWIGACJA --- */
function switchTab(tab, btnEl) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  if (tab === 'dict') renderDict();
}

updateStats();
renderCard();
</script>
