<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fiszki - Kapitel 5 Gesundheit</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 100vh; padding: 16px; }
  .header { width: 100%; max-width: 420px; text-align: center; }
  select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 15px; margin-bottom: 10px; outline: none; }
  .stats { display: flex; justify-content: space-between; font-size: 13px; color: #94a3b8; padding: 0 4px; }
  .card-wrap { perspective: 1000px; width: 100%; max-width: 420px; height: 280px; margin: 15px 0; cursor: pointer; }
  .card { width: 100%; height: 100%; position: relative; transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
  .card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid #334155; }
  .front { background: #1e293b; }
  .back { background: #0284c7; transform: rotateY(180deg); }
  .badge { position: absolute; top: 16px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; background: rgba(15,23,42,0.5); padding: 4px 10px; border-radius: 20px; }
  .word { font-size: 26px; font-weight: 700; line-height: 1.3; }
  .sub { font-size: 14px; color: #cbd5e1; margin-top: 10px; }
  .der { color: #38bdf8; } .die { color: #fb7185; } .das { color: #4ade80; }
  .controls { width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  button { padding: 15px; border: none; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; color: #fff; transition: opacity 0.2s; }
  button:active { opacity: 0.7; }
  .btn-hard { background: #e11d48; }
  .btn-ok { background: #16a34a; }
  .btn-nav { background: #334155; font-size: 13px; padding: 12px; }
</style>
</head>
<body>

<div class="header">
  <select id="lessonSelect" onchange="filterDeck()">
    <option value="all">Wszystkie lekcje (81 słówek)</option>
    <option value="1">Lektion 1: Dolegliwości i choroby</option>
    <option value="2">Lektion 2: U lekarza</option>
    <option value="3">Lektion 3: Lekarstwa</option>
    <option value="4">Lektion 4: Wypadki w domu</option>
    <option value="hard">Do powtórki (trudne)</option>
  </select>
  <div class="stats">
    <span id="counter">1 / 81</span>
    <span id="hardCount">Do powtórki: 0</span>
  </div>
</div>

<div class="card-wrap" onclick="flipCard()">
  <div class="card" id="card">
    <div class="face front">
      <div class="badge" id="lessonBadge">Lektion 1</div>
      <div class="word" id="frontText">bóle brzucha</div>
      <div class="sub">Dotknij, aby odwrócić</div>
    </div>
    <div class="face back">
      <div class="badge">Niemiecki</div>
      <div class="word" id="backText">die Bauchschmerzen</div>
      <div class="sub" id="tipText"></div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn-hard" onclick="markCard(false)">Jeszcze nie umiem</button>
  <button class="btn-ok" onclick="markCard(true)">Umiem!</button>
  <button class="btn-nav" onclick="prevCard()">← Poprzednia</button>
  <button class="btn-nav" onclick="shuffleDeck()">🔀 Wymieszaj</button>
</div>

<script>
const allWords = [
  // Lektion 1
  {l:1, pl:"bóle brzucha", de:"die Bauchschmerzen"},
  {l:1, pl:"przeziębienie", de:"die Erkältung, -en"},
  {l:1, pl:"gorączka", de:"das Fieber"},
  {l:1, pl:"grypa", de:"die Grippe, -n"},
  {l:1, pl:"kaszel", de:"der Husten"},
  {l:1, pl:"bóle głowy", de:"die Kopfschmerzen"},
  {l:1, pl:"katar", de:"der Schnupfen"},
  {l:1, pl:"odpoczywać", de:"sich erholen"},
  {l:1, pl:"przeziębić się", de:"sich erkälten"},
  {l:1, pl:"czuć się", de:"sich fühlen"},
  {l:1, pl:"boleć", de:"weh|tun"},
  {l:1, pl:"iść do apteki", de:"in die Apotheke gehen"},
  {l:1, pl:"jechać do lekarza", de:"zum Arzt fahren"},
  {l:1, pl:"skręcić nogę", de:"mit dem Fuß um|knicken"},
  {l:1, pl:"zażywać lekarstwa", de:"Medikamente ein|nehmen"},
  {l:1, pl:"spaść z krzesła", de:"vom Stuhl fallen"},
  {l:1, pl:"Przykro mi.", de:"Es tut mir leid."},
  {l:1, pl:"Szybkiego powrotu do zdrowia!", de:"Gute Besserung!"},
  {l:1, pl:"Szkoda.", de:"Das ist ja schade!"},
  // Lektion 2
  {l:2, pl:"antybiotyk", de:"das Antibiotikum, Antibiotika"},
  {l:2, pl:"lekarz", de:"der Arzt, -̈e"},
  {l:2, pl:"zwolnienie lekarskie", de:"das Attest, -e"},
  {l:2, pl:"diagnoza", de:"die Diagnose, -n"},
  {l:2, pl:"usprawiedliwienie", de:"die Entschuldigung, -en"},
  {l:2, pl:"karta zdrowia", de:"die Gesundheitskarte, -n"},
  {l:2, pl:"zapalenie gardła", de:"die Halsentzündung, -en"},
  {l:2, pl:"bóle gardła", de:"die Halsschmerzen"},
  {l:2, pl:"lekarz rodzinny", de:"der Hausarzt, -̈e"},
  {l:2, pl:"gabinet lekarski", de:"die Praxis, Praxen"},
  {l:2, pl:"recepta", de:"das Rezept, -e"},
  {l:2, pl:"syrop", de:"der Sirup, -e / -s"},
  {l:2, pl:"godziny przyjęć", de:"die Sprechstunde, -n"},
  {l:2, pl:"tabletka", de:"die Tablette, -n"},
  {l:2, pl:"termin", de:"der Termin, -e"},
  {l:2, pl:"rozbierać się", de:"sich frei|machen"},
  {l:2, pl:"badać", de:"untersuchen"},
  {l:2, pl:"przepisywać (receptę)", de:"verschreiben"},
  {l:2, pl:"zwolnienie lekarskie do szkoły", de:"ein Attest für die Schule"},
  {l:2, pl:"przyjść do kontroli", de:"zur Kontrolle kommen"},
  {l:2, pl:"przyjść na wizytę", de:"in die Sprechstunde kommen"},
  {l:2, pl:"umówić termin", de:"einen Termin aus|machen"},
  // Lektion 3
  {l:3, pl:"saszetka z lekiem", de:"der Beutel, -"},
  {l:3, pl:"lekarstwo", de:"das Medikament, -e"},
  {l:3, pl:"krople do nosa", de:"die Nasentropfen"},
  {l:3, pl:"proszek", de:"das Pulver, -"},
  {l:3, pl:"tabletka przeciwbólowa", de:"die Schmerztablette, -n"},
  {l:3, pl:"kropla", de:"der Tropfen, -"},
  {l:3, pl:"rozpuszczać", de:"auf|lösen"},
  {l:3, pl:"dawkować", de:"dosieren"},
  {l:3, pl:"ssać", de:"lutschen"},
  {l:3, pl:"połykać", de:"schlucken"},
  {l:3, pl:"bez recepty", de:"rezeptfrei"},
  {l:3, pl:"raz", de:"einmal"},
  {l:3, pl:"trzy razy dziennie", de:"dreimal täglich"},
  {l:3, pl:"co cztery godziny", de:"alle vier Stunden"},
  {l:3, pl:"przed jedzeniem", de:"vor dem Essen"},
  {l:3, pl:"po jedzeniu", de:"nach dem Essen"},
  {l:3, pl:"tabletki na grypę", de:"Tabletten gegen Grippe"},
  // Lektion 4
  {l:4, pl:"ręka", de:"der Arm, -e"},
  {l:4, pl:"krew", de:"das Blut"},
  {l:4, pl:"palec", de:"der Finger, -"},
  {l:4, pl:"nóż", de:"das Messer, -"},
  {l:4, pl:"nieszczęście", de:"das Unglück, -e"},
  {l:4, pl:"pech", de:"das Pech"},
  {l:4, pl:"uważać", de:"auf|passen"},
  {l:4, pl:"poślizgnąć się", de:"aus|rutschen"},
  {l:4, pl:"śpieszyć się", de:"sich beeilen"},
  {l:4, pl:"krwawić", de:"bluten"},
  {l:4, pl:"brać prysznic", de:"duschen"},
  {l:4, pl:"koncentrować się", de:"sich konzentrieren"},
  {l:4, pl:"wydarzyć się", de:"passieren"},
  {l:4, pl:"spadać", de:"runter|fallen"},
  {l:4, pl:"zaciąć się", de:"sich schneiden"},
  {l:4, pl:"wylewać", de:"schütten"},
  {l:4, pl:"poparzyć się", de:"sich verbrennen"},
  {l:4, pl:"niebezpieczny", de:"gefährlich"},
  {l:4, pl:"ostry", de:"scharf"},
  {l:4, pl:"mocny", de:"stark"},
  {l:4, pl:"głęboki", de:"tief"},
  {l:4, pl:"ostrożny", de:"vorsichtig"},
  {l:4, pl:"spaść z krzesła", de:"vom Stuhl runter|fallen"},
  {l:4, pl:"stanąć na krzesło", de:"sich auf einen Stuhl stellen"},
  {l:4, pl:"zaciąć się głęboko", de:"sich tief schneiden"},
  {l:4, pl:"Uwaga!", de:"Vorsicht!"},
  {l:4, pl:"Bądź ostrożny!", de:"Sei vorsichtig!"}
];

let deck = [...allWords];
let hardWords = new Set();
let index = 0;

function formatGerman(text) {
  if (text.startsWith("der ")) return `<span class="der">der</span> ` + text.slice(4);
  if (text.startsWith("die ")) return `<span class="die">die</span> ` + text.slice(4);
  if (text.startsWith("das ")) return `<span class="das">das</span> ` + text.slice(4);
  return text;
}

function renderCard() {
  const cardEl = document.getElementById("card");
  cardEl.classList.remove("flipped");
  setTimeout(() => {
    if (deck.length === 0) {
      document.getElementById("frontText").innerText = "Brak słówek w tej kategorii!";
      document.getElementById("backText").innerText = "";
      document.getElementById("counter").innerText = "0 / 0";
      return;
    }
    const item = deck[index];
    document.getElementById("lessonBadge").innerText = "Lektion " + item.l;
    document.getElementById("frontText").innerText = item.pl;
    document.getElementById("backText").innerHTML = formatGerman(item.de);
    document.getElementById("tipText").innerText = item.de.includes("|") ? "Czasownik rozdzielnie złożony" : "";
    document.getElementById("counter").innerText = `${index + 1} / ${deck.length}`;
    document.getElementById("hardCount").innerText = `Do powtórki: ${hardWords.size}`;
  }, 150);
}

function flipCard() {
  document.getElementById("card").classList.toggle("flipped");
}

function markCard(known) {
  if (! deck.length) return;
  const current = deck[index];
  if (!known) hardWords.add(current);
  else hardWords.delete(current);
  index = (index + 1) % deck.length;
  renderCard();
}

function prevCard() {
  if (!deck.length) return;
  index = (index - 1 + deck.length) % deck.length;
  renderCard();
}

function shuffleDeck() {
  deck.sort(() => Math.random() - 0.5);
  index = 0;
  renderCard();
}

function filterDeck() {
  const val = document.getElementById("lessonSelect").value;
  if (val === "all") deck = [...allWords];
  else if (val === "hard") deck = Array.from(hardWords);
  else deck = allWords.filter(w => w.l == val);
  index = 0;
  renderCard();
}

renderCard();
</script>
</body>
</html>
